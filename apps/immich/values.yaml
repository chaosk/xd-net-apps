# Official Immich Helm chart — https://docs.immich.app/install/kubernetes/
# Chart source: https://github.com/immich-app/immich-charts
#
# Requires Secret `immich-db` in namespace `immich` (CNPG bootstrap + app): see README.
# App settings (OAuth, storage template, ffmpeg): Secret `immich-config` in secrets/ (SOPS).

valkey:
  enabled: true
immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library
  # Chart mounts secrets/immich-config.yaml (platform-secrets); do not set immich.configuration here.
  configurationKind: Secret
  existingConfiguration: immich-config
# GPU and DB env: server-only block below; top-level controllers still apply shared env to all components.
# Chart can emit its own ServiceMonitor; we scrape from apps/monitoring with release: kube-prometheus-stack.
server:
  serviceMonitor:
    main:
      enabled: false
  controllers:
    main:
      # Single GPU node (xd-w-1): RollingUpdate needs 2× GPU+CPU briefly and stays Pending.
      strategy: Recreate
      pod:
        nodeSelector:
          intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              memory: 8Gi
              gpu.intel.com/i915: 1
# OpenVINO backend for Intel Arc / Iris — https://docs.immich.app/features/ml-hardware-acceleration
machine-learning:
  controllers:
    main:
      pod:
        nodeSelector:
          intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.0.2-openvino
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              gpu.intel.com/i915: 1
            limits:
              memory: 6Gi
              gpu.intel.com/i915: 1
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.0.2
        env:
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: host
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: user
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: dbname

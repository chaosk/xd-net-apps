apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Immich
    gethomepage.dev/description: Photo and video library
    gethomepage.dev/icon: si-immich
    gethomepage.dev/href: "https://photos.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=server,app.kubernetes.io/instance=immich
    gethomepage.dev/widget.type: immich
    gethomepage.dev/widget.url: "http://immich-server.immich.svc.cluster.local:2283"
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.fields: '["photos", "videos", "storage"]'
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - photos.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: immich-server
          port: 2283

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
spec:
  instances: 1
  enablePDB: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        # A new name per PostgreSQL major: pg_upgrade starts a new system ID and timeline 1,
        # and the plugin doesn't keep them apart. PostgreSQL 16 backups stay under immich-db.
        serverName: immich-db-pg18
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  storage:
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db
      # https://docs.immich.app/administration/postgres-standalone/#with-superuser-permission
      postInitSQL:
        - ALTER USER immich WITH SUPERUSER;
      postInitApplicationSQL:
        - CREATE EXTENSION vchord CASCADE;
        - CREATE EXTENSION earthdistance CASCADE;

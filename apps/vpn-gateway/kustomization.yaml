apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vpn-gateway

resources:
  - namespace.yaml
  - gluetun-iptables-configmap.yaml

patches:
  - path: gluetun-iptables-patch.yaml
    target:
      kind: Deployment
      name: vpn-gateway-pod-gateway-main
      namespace: vpn-gateway

helmCharts:
  - name: pod-gateway
    repo: https://angelnu.github.io/helm-charts/
    version: 7.1.1
    releaseName: vpn-gateway
    namespace: vpn-gateway
    valuesFile: values-pod-gateway.yaml

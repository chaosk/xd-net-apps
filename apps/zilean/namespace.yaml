apiVersion: v1
kind: Namespace
metadata:
  name: zilean
  labels:
    name: zilean
    allows-vpn-gateway: "true"
    # pod-gateway init/sidecar needs NET_ADMIN and NET_RAW (baseline forbids them).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

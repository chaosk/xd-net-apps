# bjw-s app-template — https://bjw-s-labs.github.io/helm-charts/docs/app-template/
# Zilean — https://github.com/Thoroslives/zilean (fork of iPromKnight/zilean)
controllers:
  main:
    replicas: 0
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/thoroslives/zilean
          tag: v3.10.1
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
          Zilean__EnableDashboard: "true"
          POSTGRES_HOST: zilean-db-rw
          POSTGRES_PORT: "5432"
          POSTGRES_DB: zilean
          POSTGRES_USER:
            valueFrom:
              secretKeyRef:
                name: zilean-db
                key: username
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: zilean-db
                key: password
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthchecks/ping
                port: 8181
              initialDelaySeconds: 60
              periodSeconds: 60
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthchecks/ready
                port: 8181
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
service:
  main:
    controller: main
    ports:
      http:
        port: 8181
persistence:
  data:
    enabled: true
    existingClaim: zilean-data
    globalMounts:
      - path: /app/data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
defaultPodOptions:
  labels:
    vpn-gateway: "true"

# PO token provider for yt-dlp (Tube Archivist Application settings).
# https://docs.tubearchivist.com/settings/application/#po-token-provider-url
# Pin image tag to match bbilly1/tubearchivist v0.5.10 (requirements.plugins.txt).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgutil-provider
  namespace: tubearchivist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgutil-provider
  template:
    metadata:
      labels:
        app: bgutil-provider
    spec:
      containers:
        - name: bgutil-provider
          image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
          ports:
            - containerPort: 4416
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bgutil-provider
  namespace: tubearchivist
spec:
  selector:
    app: bgutil-provider
  ports:
    - port: 4416
      targetPort: 4416
      name: http

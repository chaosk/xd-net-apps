# PO token provider for yt-dlp (Tube Archivist Application settings).
# https://docs.tubearchivist.com/settings/application/#po-token-provider-url
# Pin manually; major version must match the yt-dlp pot plugin TA bundles (image requirements.txt),
# otherwise the plugin treats the server as unavailable and silently skips PO tokens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgutil-provider
  namespace: tubearchivist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgutil-provider
  template:
    metadata:
      labels:
        app: bgutil-provider
        vpn-gateway: "true"
    spec:
      containers:
        - name: bgutil-provider
          image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
          ports:
            - containerPort: 4416
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4416
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bgutil-provider
  namespace: tubearchivist
spec:
  selector:
    app: bgutil-provider
  ports:
    - port: 4416
      targetPort: 4416
      name: http

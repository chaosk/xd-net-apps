apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubearchivist
  namespace: tubearchivist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tubearchivist
  template:
    metadata:
      labels:
        app: tubearchivist
        vpn-gateway: "true"
    spec:
      # Non-root app (v0.6+). Keep runAsUser on the container only — pod-gateway
      # gateway-init must stay root for NET_ADMIN.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-cache-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1000:1000 /cache
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: tubearchivist
          image: bbilly1/tubearchivist:v0.6.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ES_URL
              value: http://archivist-es.tubearchivist.svc.cluster.local:9200
            - name: REDIS_CON
              value: redis://archivist-redis.tubearchivist.svc.cluster.local:6379
            - name: TA_HOST
              value: https://tubearchivist.net.ecksd.ee http://tubearchivist.tubearchivist.svc.cluster.local:8000
            - name: TZ
              value: UTC
            - name: TA_USERNAME
              value: tubearchivist
            - name: TA_PASSWORD
              value: tubearchivist
            - name: TA_ENABLE_AUTH_PROXY
              value: "true"
            - name: TA_AUTH_PROXY_USERNAME_HEADER
              value: X_AUTHENTIK_USERNAME
            - name: TA_AUTH_PROXY_LOGOUT_URL
              value: https://tubearchivist.net.ecksd.ee/outpost.goauthentik.io/sign_out
            - name: TA_AUTO_UPDATE_YTDLP
              value: release
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubearchivist
                  key: ELASTIC_PASSWORD
          volumeMounts:
            - name: youtube
              mountPath: /youtube
            - name: cache
              mountPath: /cache
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: tubearchivist.net.ecksd.ee
            initialDelaySeconds: 30
            periodSeconds: 120
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: tubearchivist.net.ecksd.ee
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: 768Mi
              cpu: 100m
            limits:
              memory: 1536Mi
              cpu: "2"
      volumes:
        - name: youtube
          persistentVolumeClaim:
            claimName: tubearchivist-youtube
        - name: cache
          persistentVolumeClaim:
            claimName: tubearchivist-cache

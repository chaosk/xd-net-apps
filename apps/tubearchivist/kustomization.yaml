apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tubearchivist
resources:
  - namespace.yaml
  - pvc.yaml
  - elasticsearch.yaml
  - redis.yaml
  - bgutil-provider.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - securitypolicy-forward-auth.yaml
# Main app image only (ES/redis/bgutil are pinned separately in their manifests).
images:
  - name: bbilly1/tubearchivist
    newTag: v0.5.11
    newName: bbilly1/tubearchivist

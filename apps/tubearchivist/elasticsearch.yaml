apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archivist-es
  namespace: tubearchivist
spec:
  serviceName: archivist-es
  replicas: 1
  selector:
    matchLabels:
      app: archivist-es
  template:
    metadata:
      labels:
        app: archivist-es
    spec:
      containers:
        - name: elasticsearch
          # Pin to the ES version shipped by Tube Archivist (also available as :latest).
          # Node-level vm.max_map_count is set in xd-net Talos patches — no privileged sysctl init.
          image: bbilly1/tubearchivist-es:8.19.0
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubearchivist
                  key: ELASTIC_PASSWORD
            - name: ES_JAVA_OPTS
              # Upstream compose: 1g. Index ~35Mi store / ~2.3k videos (May 2026); heap used ~790Mi — 1g is enough for data.
              value: "-Xms1g -Xmx1g"
            - name: xpack.security.enabled
              value: "true"
            - name: discovery.type
              value: single-node
            - name: path.repo
              value: /usr/share/elasticsearch/data/snapshot
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              memory: 1536Mi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: "2"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tubearchivist-es
---
apiVersion: v1
kind: Service
metadata:
  name: archivist-es
  namespace: tubearchivist
spec:
  selector:
    app: archivist-es
  ports:
    - port: 9200
      targetPort: 9200
      name: http

apiVersion: v1
kind: Namespace
metadata:
  name: tubearchivist
  labels:
    name: tubearchivist
    allows-vpn-gateway: "true"
    # Stay privileged: pod-gateway injects NET_ADMIN/NET_RAW; Elasticsearch needs a
    # privileged sysctl init and IPC_LOCK (baseline forbids all of these).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

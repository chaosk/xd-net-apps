apiVersion: v1
kind: Namespace
metadata:
  name: tubearchivist
  labels:
    name: tubearchivist
    allows-vpn-gateway: "true"
    # Elasticsearch adds IPC_LOCK (not allowed under baseline); vm.max_map_count is node-level in xd-net.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

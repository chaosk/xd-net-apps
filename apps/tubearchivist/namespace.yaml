apiVersion: v1
kind: Namespace
metadata:
  name: tubearchivist
  labels:
    name: tubearchivist
    # Elasticsearch needs privileged sysctl init + IPC_LOCK; cluster default is baseline.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

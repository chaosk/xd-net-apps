apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-kubernetes-discovery
rules:
  # Kubernetes widget (cluster + nodes) and pod-selector status on discovered tiles.
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  # Gateway API HTTPRoute discovery (kubernetes.yaml gateway: true). Ingress/Traefik off.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-kubernetes-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-kubernetes-discovery
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage

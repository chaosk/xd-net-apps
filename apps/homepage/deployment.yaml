apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v1.13.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: net.ecksd.ee
        # Avoid ~500ms IPv6 attempt per widget proxy call on dual-stack Talos nodes.
        - name: HOMEPAGE_PROXY_DISABLE_IPV6
          value: "true"
        - name: HOMEPAGE_VAR_AUTHENTIK_TOKEN
          valueFrom:
            secretKeyRef:
              name: homepage-authentik-widget
              key: HOMEPAGE_VAR_AUTHENTIK_TOKEN
              optional: true
        - name: HOMEPAGE_VAR_TUBEARCHIVIST_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-tubearchivist-widget
              key: HOMEPAGE_VAR_TUBEARCHIVIST_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_TRACEARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-tracearr-widget
              key: HOMEPAGE_VAR_TRACEARR_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_PLEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: homepage-plex-widget
              key: HOMEPAGE_VAR_PLEX_TOKEN
              optional: true
        - name: HOMEPAGE_VAR_SONARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-sonarr-widget
              key: HOMEPAGE_VAR_SONARR_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_RADARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-radarr-widget
              key: HOMEPAGE_VAR_RADARR_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_IMMICH_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-immich-widget
              key: HOMEPAGE_VAR_IMMICH_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_PAPERLESS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: homepage-paperless-widget
              key: HOMEPAGE_VAR_PAPERLESS_API_TOKEN
              optional: true
        - name: HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-speedtest-tracker-widget
              key: HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_MINIFLUX_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-miniflux-widget
              key: HOMEPAGE_VAR_MINIFLUX_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_HOMEASSISTANT_TOKEN
          valueFrom:
            secretKeyRef:
              name: homepage-homeassistant-widget
              key: HOMEPAGE_VAR_HOMEASSISTANT_TOKEN
              optional: true
        - name: HOMEPAGE_VAR_DSM_USERNAME
          valueFrom:
            secretKeyRef:
              name: homepage-dsm-widget
              key: HOMEPAGE_VAR_DSM_USERNAME
              optional: true
        - name: HOMEPAGE_VAR_DSM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homepage-dsm-widget
              key: HOMEPAGE_VAR_DSM_PASSWORD
              optional: true
        - name: HOMEPAGE_VAR_UNIFI_USERNAME
          valueFrom:
            secretKeyRef:
              name: homepage-unifi-widget
              key: HOMEPAGE_VAR_UNIFI_USERNAME
              optional: true
        - name: HOMEPAGE_VAR_UNIFI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homepage-unifi-widget
              key: HOMEPAGE_VAR_UNIFI_PASSWORD
              optional: true
        - name: HOMEPAGE_VAR_PANGOLIN_API_URL
          valueFrom:
            secretKeyRef:
              name: homepage-pangolin-widget
              key: HOMEPAGE_VAR_PANGOLIN_API_URL
              optional: true
        - name: HOMEPAGE_VAR_PANGOLIN_DASHBOARD_URL
          valueFrom:
            secretKeyRef:
              name: homepage-pangolin-widget
              key: HOMEPAGE_VAR_PANGOLIN_DASHBOARD_URL
              optional: true
        - name: HOMEPAGE_VAR_PANGOLIN_ORG
          valueFrom:
            secretKeyRef:
              name: homepage-pangolin-widget
              key: HOMEPAGE_VAR_PANGOLIN_ORG
              optional: true
        - name: HOMEPAGE_VAR_PANGOLIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-pangolin-widget
              key: HOMEPAGE_VAR_PANGOLIN_API_KEY
              optional: true
        - name: HOMEPAGE_VAR_ARGOCD_API_KEY
          valueFrom:
            secretKeyRef:
              name: homepage-argocd-widget
              key: HOMEPAGE_VAR_ARGOCD_API_KEY
              optional: true
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: images
          mountPath: /app/public/images
          readOnly: true
        - name: logs
          mountPath: /app/config/logs
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1500m"
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: images
        configMap:
          name: homepage-images
      - name: logs
        emptyDir: {}


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# Static assets for favicon (settings.yaml) and logo widget — paths under /app/public/images.
# Add files before kustomize build; restart the pod after changing images (Homepage limitation).
configMapGenerator:
  - name: homepage-images
    files:
      - images/favicon.png
      - images/logo.png
    options:
      disableNameSuffixHash: true
images:
  - name: ghcr.io/gethomepage/homepage
    newTag: v2.0.0
    newName: ghcr.io/gethomepage/homepage

apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: XD Net
    language: en
    headerStyle: clean
    hideVersion: true
    statusStyle: dot

    layout:
      Media:
        icon: mdi-play-network-outline
        style: row
        columns: 3
      Arr!:
        icon: mdi-pirate
      Identity:
        style: row
        columns: 3
      Infra:
        style: row
        columns: 3

  bookmarks.yaml: ""

  services.yaml: |
    - Arr!:
        - Upcoming:
            description: TV show episodes
            widget:
              type: calendar
              view: agenda
              maxEvents: 7
              integrations:
                - type: sonarr
                  service_group: Media
                  service_name: Sonarr
                  color: teal
                  params:
                    unmonitored: true

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  kubernetes.yaml: |
    mode: cluster

    # Automatic service discovery sources
    ingress: false
    traefik: false
    gateway: true

  docker.yaml: ""

  proxmox.yaml: ""

  custom.css: ""

  custom.js: ""

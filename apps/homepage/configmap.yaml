apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: XD Net
    language: en
    headerStyle: clean
    hideVersion: true
    statusStyle: dot

    layout:
      Media:
        icon: mdi-play-network-outline
        style: row
        columns: 3
      Arr!:
        icon: mdi-pirate
      Identity:
        style: row
        columns: 3
      Infra:
        style: row
        columns: 3

  bookmarks.yaml: ""

  services.yaml: ""

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  kubernetes.yaml: |
    mode: cluster

    # Automatic service discovery sources
    ingress: false
    traefik: false
    gateway: true

  docker.yaml: ""

  proxmox.yaml: |
    ---
    # pve:
    # url: https://proxmox.host.or.ip:8006
    # token: username@pam!Token ID
    # secret: secret

  custom.css: |

  custom.js: |



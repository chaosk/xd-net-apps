apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - postgres.yaml
  - backup.yaml
  - httproute.yaml
  - scrape-cnpg.yaml
  - scrape-apps.yaml
  - scrape-platform.yaml
  - rules-cnpg.yaml
  - rules-vpn.yaml
  - probes-vpn.yaml
  - dashboards/

# kube-prometheus-stack renders hostNetwork: false explicitly; the API/operator often
# omits false defaults on read. Strip them so Git matches live state (Argo CD diff).
patchesJson6902:
  - target:
      group: monitoring.coreos.com
      kind: Alertmanager
      name: kube-prometheus-stack-alertmanager
    patch: |
      - op: remove
        path: /spec/hostNetwork
  - target:
      group: monitoring.coreos.com
      kind: Prometheus
      name: kube-prometheus-stack-prometheus
    patch: |
      - op: remove
        path: /spec/hostNetwork
  - target:
      group: apps
      kind: Deployment
      name: kube-prometheus-stack-kube-state-metrics
    patch: |
      - op: remove
        path: /spec/template/spec/hostNetwork

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 91.4.1
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values-prometheus.yaml
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.3.0
    releaseName: loki
    namespace: monitoring
    valuesFile: values-loki.yaml
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.12.1
    releaseName: alloy
    namespace: monitoring
    valuesFile: values-alloy.yaml
  - name: prometheus-blackbox-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 11.18.0
    releaseName: prometheus-blackbox-exporter
    namespace: monitoring
    valuesFile: values-blackbox.yaml

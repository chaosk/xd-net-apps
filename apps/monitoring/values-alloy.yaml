# https://grafana.com/docs/alloy/latest/configure/kubernetes/

crds:
  create: false

controller:
  type: daemonset

alloy:
  enableReporting: false
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        forward_to = [loki.write.loki.receiver]

        // Plex log-tailer emits file lines; use the timestamp in the log body (PMS logs in UTC).
        stage.match {
          selector = "{namespace=\"plex\", container=\"log-tailer\"} |~ \"^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4}\""

          stage.regex {
            expression = "^(?P<plex_ts>[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}) \\[[0-9]+\\] (?P<level>DEBUG|INFO|WARN|ERROR|FATAL) - "
          }

          stage.timestamp {
            source   = "plex_ts"
            format   = "Jan 2, 2006 15:04:05.000"
            location = "UTC"
          }

          stage.labels {
            values = {
              level = "",
            }
          }
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

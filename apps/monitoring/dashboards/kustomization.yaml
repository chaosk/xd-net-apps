apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# Avoid kubectl last-applied-configuration on large JSON (Argo 256KiB annotation limit).
commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true

configMapGenerator:
  - name: grafana-dashboard-cnpg
    files:
      - cnpg.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-cilium
    files:
      - cilium.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Platform
  - name: grafana-dashboard-envoy
    files:
      - envoy-gateway-global.json
      - envoy-clusters.json
      - envoy-proxy-global.json
      - envoy-resources-monitor.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Platform
  - name: grafana-dashboard-speedtest-tracker
    files:
      - speedtest-tracker.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Misc

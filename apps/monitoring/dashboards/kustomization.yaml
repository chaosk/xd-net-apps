apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-dashboard-cilium
    files:
      - cilium.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Platform
  - name: grafana-dashboard-envoy
    files:
      - envoy.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Platform
  - name: grafana-dashboard-loki
    files:
      - loki.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana/folder: Logs

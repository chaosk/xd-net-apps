# https://github.com/grafana-community/helm-charts/tree/main/charts/tempo
# Homelab: monolithic Tempo, traces on a Synology PVC. Grafana queries port 3200.
# OTLP: grpc 4317, http 4318 on Service tempo.

tempo:
  reportingEnabled: false
  retention: 72h
  # Span metrics and service graphs for Grafana's Service Graph view.
  # The generator WAL lives on the Tempo volume, next to traces.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/generator
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

persistence:
  enabled: true
  storageClassName: synology
  size: 10Gi

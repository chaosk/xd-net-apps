# https://github.com/grafana-community/helm-charts/tree/main/charts/tempo
# Homelab: monolithic Tempo, traces on a Synology PVC. Grafana queries port 3200.
# OTLP: grpc 4317, http 4318 on Service tempo.

tempo:
  reportingEnabled: false
  retention: 72h
  # Span metrics and service graphs for Grafana's Service Graph view.
  # The generator WAL lives on the Tempo volume, next to traces.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/generator
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  # 1Gi OOM-killed Tempo while it compacted a backlog of ~30k blocks after
  # the poller was stuck on an empty block (Nov 2026).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

persistence:
  enabled: true
  storageClassName: synology
  size: 10Gi

# Scrape Tempo's own metrics (tempodb_retention_*, tempodb_blocklist_length, …).
# The chart's ServiceMonitor skips tempo-headless (prometheus.io/service-monitor: "false").
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack

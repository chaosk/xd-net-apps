# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    # Apiserver SLO recording rules and burn-rate alerts need full histogram scrapes.
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

# Thin apiserver scrape: ~159k samples/job at 30s was ~55% of Prometheus ingest and
# loaded control-plane apiservers. Drop histograms and high-cardinality labels; scrape
# every 60s. Re-enable chart defaults temporarily when debugging API latency.
kubeApiServer:
  serviceMonitor:
    interval: 60s
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: .*_bucket
      - action: drop
        sourceLabels: [__name__]
        regex: apiserver_(request_slo|request_sli|response_sizes|watch_events_sizes|request_filter_duration_seconds).*
      - action: drop
        sourceLabels: [__name__]
        regex: etcd_request_.*
      - action: drop
        sourceLabels: [__name__]
        regex: rest_client_.*
      - action: labeldrop
        regex: (resource|subresource|group|version|scope)

alertmanager:
  enabled: true
  # Default receiver is null: only the routed critical set hits Home Assistant.
  # Webhook URL (with HA webhook id) lives in Secret alertmanager-ha — see README.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        # Watchdog is always firing; keep it on null (no phone spam). Use an
        # external dead-man's snitch later if you want "Alertmanager died" paging.
        - receiver: "null"
          matchers:
            - alertname = Watchdog
        - receiver: home-assistant
          matchers:
            - alertname =~ "^(KubeNodeNotReady|KubeNodeUnreachable|KubeAPIDown|KubePersistentVolumeFillingUp|KubePersistentVolumeInodesFillingUp|NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|CNPGInstanceDown|CNPGClusterDown)$"
    receivers:
      - name: "null"
      - name: home-assistant
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ha/url
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-ha
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: synology
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  # Internal metadata DB (users, prefs, secure values) — not metrics storage.
  persistence:
    enabled: false
  extraSecretMounts:
    - name: grafana-db-credentials
      secretName: grafana-db
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-db
      readOnly: true
    - name: grafana-oidc-credentials
      secretName: grafana-oidc
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-oidc
      readOnly: true
  grafana.ini:
    server:
      root_url: https://grafana.net.ecksd.ee/
    database:
      type: postgres
      host: grafana-db-rw.monitoring.svc.cluster.local:5432
      name: grafana
      user: grafana
      ssl_mode: disable
      password: $__file{/etc/secrets/grafana-db/password}
    auth:
      signout_redirect_url: https://authentik.net.ecksd.ee/application/o/grafana/end-session/
      oauth_auto_login: true
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      client_id: $__file{/etc/secrets/grafana-oidc/client_id}
      client_secret: $__file{/etc/secrets/grafana-oidc/client_secret}
      scopes: openid profile email groups
      auth_url: https://authentik.net.ecksd.ee/application/o/authorize/
      token_url: https://authentik.net.ecksd.ee/application/o/token/
      api_url: https://authentik.net.ecksd.ee/application/o/userinfo/
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor'
      use_pkce: true
    users:
      auto_assign_org: true
      auto_assign_org_role: Viewer
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 45GB
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: synology
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

crds:
  enabled: true

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: synology
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  # Internal metadata DB (users, prefs, secure values) — not metrics storage.
  persistence:
    enabled: false
  extraSecretMounts:
    - name: grafana-db-credentials
      secretName: grafana-db
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-db
      readOnly: true
  grafana.ini:
    database:
      type: postgres
      host: grafana-db-rw.monitoring.svc.cluster.local:5432
      name: grafana
      user: grafana
      ssl_mode: disable
      password: $__file{/etc/secrets/grafana-db/password}
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 45GB
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: synology
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

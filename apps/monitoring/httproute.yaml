apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Management
    gethomepage.dev/weight: "40"
    gethomepage.dev/name: Grafana
    gethomepage.dev/description: Metrics and dashboards
    gethomepage.dev/icon: si-grafana
    gethomepage.dev/href: "https://grafana.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80

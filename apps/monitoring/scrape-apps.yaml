# Authentik exposes /metrics on container port "metrics" (9300), not on the HTTP Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-server
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - authentik
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/service: immich-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitmagnet-main
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - bitmagnet
  selector:
    matchLabels:
      app.kubernetes.io/service: bitmagnet-main
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

# Authentik exposes /metrics on container port "metrics" (9300), not on the HTTP Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-server
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - authentik
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/service: immich-server
  endpoints:
    # Port 2283 serves the web UI (HTML), not Prometheus text; metrics need telemetry enabled on 8081/8082.
    - port: metrics-api
      path: /metrics
      interval: 30s
    - port: metrics-ms
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitmagnet-main
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - bitmagnet
  selector:
    matchLabels:
      app.kubernetes.io/service: bitmagnet-main
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Enable Prometheus under Settings → Data platforms in Speedtest Tracker; allow scrape from the cluster (e.g. 10.0.0.0/8).
# https://docs.speedtest-tracker.dev/settings/data-platforms/prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: speedtest-tracker
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - speedtest-tracker
  selector:
    matchLabels:
      app.kubernetes.io/service: speedtest-tracker
  endpoints:
    - port: http
      path: /prometheus
      interval: 5m
      scrapeTimeout: 10s

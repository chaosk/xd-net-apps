# JDownloader 2 — https://github.com/jlesage/docker-jdownloader-2
controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: docker.io/jlesage/jdownloader-2
          tag: "v26.09.1"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
          USER_ID: "568"
          GROUP_ID: "568"
          # TLS and login are at the Gateway / Authentik; keep the container HTTP.
          SECURE_CONNECTION: "0"
          WEB_AUTHENTICATION: "0"
          DISPLAY_WIDTH: "1920"
          DISPLAY_HEIGHT: "1080"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 5800
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 5800
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
service:
  main:
    controller: main
    ports:
      http:
        port: 5800
persistence:
  config:
    enabled: true
    existingClaim: jdownloader-config
    globalMounts:
      - path: /config
  downloads:
    enabled: true
    existingClaim: jdownloader-downloads
    globalMounts:
      - path: /output
  # jlesage GUI containers need a larger /dev/shm than the 64Mi Kubernetes default.
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    globalMounts:
      - path: /dev/shm
defaultPodOptions:
  labels:
    vpn-gateway: "true"
  securityContext:
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

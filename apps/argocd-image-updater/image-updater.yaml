# ImageUpdater CR: per-app image rules live here (not on Argo CD Application annotations).
# Git credentials: Secret argocd/argocd-image-updater-git (xd-net Terraform).
# Commit signing: Secret argocd/argocd-image-updater-signing + values.yaml git.* settings.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: xd-net-apps
spec:
  writeBackConfig:
    method: git:secret:argocd/argocd-image-updater-git
    gitConfig:
      repository: git@github.com:chaosk/xd-net-apps.git
      branch: master
      writeBackTarget: helmvalues:values.yaml
  commonUpdateSettings:
    forceUpdate: false
  applicationRefs:
    - namePattern: actual-budget
      images:
        - alias: actual
          imageName: ghcr.io/actualbudget/actual-server
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["latest", "nightly", "edge", "sha-*", "*alpine*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: authentik
      images:
        - alias: authentik
          imageName: ghcr.io/goauthentik/server
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^20[0-9]{2}\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["*-rc*", "*-beta*", "*dev*", "latest"]
          manifestTargets:
            helm:
              name: global.image.repository
              tag: global.image.tag

    - namePattern: bazarr
      images:
        - alias: bazarr
          imageName: ghcr.io/home-operations/bazarr:~1
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: bambuddy
      images:
        - alias: bambuddy
          imageName: ghcr.io/maziggy/bambuddy:~1
          commonUpdateSettings:
            # 1.x uses three-part tags (1.2.5); 0.2.x was four-part and broke semver.
            updateStrategy: semver
            allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["*-amd64*", "*-arm64*", "*-b*", "*daily*", "*dev*", "*beta*", "*rc*", "latest", "cache*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag
        # Optional server-side slicing service (second app-template controller in values.yaml).
        # Its tags are the BamBuddy version prefixed with "bambuddy-" (e.g. bambuddy-1.2.5),
        # so newest-build keeps it in lockstep with the app release above.
        - alias: bambu-studio-api
          imageName: ghcr.io/maziggy/bambu-studio-api
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^bambuddy-1\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["latest", "*daily*", "*-amd64*", "*-arm64*"]
          manifestTargets:
            helm:
              name: controllers.bambu-studio.containers.main.image.repository
              tag: controllers.bambu-studio.containers.main.image.tag

    - namePattern: bitmagnet
      images:
        - alias: bitmagnet
          imageName: ghcr.io/bitmagnet-io/bitmagnet:~0
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: homepage
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-git
        gitConfig:
          writeBackTarget: kustomization
      images:
        - alias: homepage
          imageName: ghcr.io/gethomepage/homepage:>=v1.0.0
          commonUpdateSettings:
            updateStrategy: semver
          manifestTargets:
            kustomize:
              name: ghcr.io/gethomepage/homepage

    - namePattern: home-assistant
      images:
        - alias: homeassistant
          imageName: ghcr.io/home-assistant/home-assistant
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^20[0-9]{2}\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["*-b*", "*dev*", "*beta*", "*rc*", "stable", "latest", "dev"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag
        - alias: matter-server
          imageName: ghcr.io/home-assistant-libs/python-matter-server:~6
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["*-rc*", "*-beta*", "*dev*", "stable", "latest"]
          manifestTargets:
            helm:
              name: controllers.main.containers.matter-server.image.repository
              tag: controllers.main.containers.matter-server.image.tag

    - namePattern: immich
      images:
        - alias: server
          imageName: ghcr.io/immich-app/immich-server:~v3
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["*dev*", "*pr-*", "*staging*", "latest"]
          manifestTargets:
            helm:
              # Chart sets repository under server.*; tag override uses top-level controllers (bjw-s merge).
              name: server.controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag
        # ML tags are v3.x.y-openvino; ~v3 semver does not match that suffix — filter with allowTags + alphabetical.
        - alias: ml
          imageName: ghcr.io/immich-app/immich-machine-learning
          commonUpdateSettings:
            updateStrategy: alphabetical
            # Keep ML on the same major line as server (~v3).
            allowTags: "regexp:^v3\\.[0-9]+\\.[0-9]+-openvino$"
            ignoreTags: ["*dev*", "*pr-*", "*staging*", "latest"]
          manifestTargets:
            helm:
              name: machine-learning.controllers.main.containers.main.image.repository
              tag: machine-learning.controllers.main.containers.main.image.tag

    - namePattern: invidious
      images:
        # Invidious and its companion publish date-stamped tags (e.g. 2025.09.29-0065a3e);
        # newest-build picks the most recently built one and keeps both in lockstep.
        - alias: invidious
          imageName: quay.io/invidious/invidious
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^20[0-9]{2}\\.[0-9]{2}\\.[0-9]{2}-[0-9a-f]+$"
            ignoreTags: ["latest", "master", "*-arm64*", "*-amd64*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag
        - alias: companion
          imageName: quay.io/invidious/invidious-companion
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^20[0-9]{2}\\.[0-9]{2}\\.[0-9]{2}-[0-9a-f]+$"
            ignoreTags: ["latest", "master", "*-arm64*", "*-amd64*"]
          manifestTargets:
            helm:
              name: controllers.companion.containers.main.image.repository
              tag: controllers.companion.containers.main.image.tag

    - namePattern: mealie
      images:
        - alias: mealie
          imageName: ghcr.io/mealie-recipes/mealie:~v3
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["*-rc*", "*-beta*", "*dev*", "latest"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: metrics-server
      images:
        - alias: metrics-server
          imageName: registry.k8s.io/metrics-server/metrics-server:~v0.7
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag

    - namePattern: miniflux
      images:
        - alias: miniflux
          imageName: miniflux/miniflux:~2
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["*-rc*", "*-beta*", "*dev*", "latest"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: paperless-ngx
      images:
        - alias: paperless
          imageName: ghcr.io/paperless-ngx/paperless-ngx:~2
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["*-rc*", "*-beta*", "*dev*", "latest"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: peanut
      images:
        - alias: peanut
          imageName: docker.io/brandawg93/peanut:~6
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["latest", "test", "*-beta*", "*-rc*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: plex
      images:
        - alias: plex
          imageName: docker.io/plexinc/pms-docker
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^1\\.[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-[0-9a-f0-9]+$"
            ignoreTags: ["*beta*", "*dev*", "latest"]
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag

    - namePattern: prowlarr
      images:
        - alias: prowlarr
          imageName: ghcr.io/home-operations/prowlarr
          commonUpdateSettings:
            # home-operations publishes 4-part build tags (e.g. 2.3.7.5365); semver ~ constraints skip them.
            updateStrategy: newest-build
            allowTags: "regexp:^2(\\.[0-9]+)+$"
            ignoreTags: ["*-b*", "*beta*", "*dev*", "*rc*", "latest", "*-amd64*", "*-arm64*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: qbittorrent
      images:
        - alias: qbittorrent
          imageName: ghcr.io/home-operations/qbittorrent:~5
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: radarr
      images:
        - alias: radarr
          imageName: ghcr.io/home-operations/radarr
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^6(\\.[0-9]+)+$"
            ignoreTags: ["*-b*", "*beta*", "*dev*", "*rc*", "latest", "*-amd64*", "*-arm64*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: sonarr
      images:
        - alias: sonarr
          imageName: ghcr.io/home-operations/sonarr
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^4(\\.[0-9]+)+$"
            ignoreTags: ["*-b*", "*beta*", "*dev*", "*rc*", "latest", "*-amd64*", "*-arm64*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: spoolman
      images:
        - alias: spoolman
          imageName: ghcr.io/donkie/spoolman
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
            ignoreTags: ["latest", "edge", "master", "pr-*", "sha-*"]
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: speedtest-tracker
      images:
        - alias: speedtest
          imageName: lscr.io/linuxserver/speedtest-tracker
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^v1\\.[0-9]+\\.[0-9]+(-ls[0-9]+)?$"
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag

    - namePattern: tracearr
      images:
        - alias: tracearr
          imageName: ghcr.io/connorgallopo/tracearr:~1
          manifestTargets:
            helm:
              name: tracearr.image.repository
              tag: tracearr.image.tag

    - namePattern: unpoller
      images:
        - alias: unpoller
          imageName: ghcr.io/unpoller/unpoller:~v3
          commonUpdateSettings:
            updateStrategy: semver
            ignoreTags: ["*-rc*", "*-beta*", "*-dev*", "latest"]
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag

    - namePattern: tubearchivist
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-git
        gitConfig:
          writeBackTarget: kustomization
      images:
        - alias: tubearchivist
          imageName: bbilly1/tubearchivist:~v0
          manifestTargets:
            kustomize:
              name: bbilly1/tubearchivist

    - namePattern: vpn-gateway
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-git
        gitConfig:
          writeBackTarget: helmvalues:values-pod-gateway.yaml
      images:
        - alias: gluetun
          imageName: ghcr.io/qdm12/gluetun:~v3
          manifestTargets:
            helm:
              name: controllers.main.containers.gluetun.image.repository
              tag: controllers.main.containers.gluetun.image.tag
        - alias: gateway
          imageName: ghcr.io/angelnu/pod-gateway:~v1
          manifestTargets:
            helm:
              name: controllers.main.containers.main.image.repository
              tag: controllers.main.containers.main.image.tag
        - alias: admission
          imageName: ghcr.io/angelnu/gateway-admision-controller:~v3
          manifestTargets:
            helm:
              name: controllers.webhook.containers.main.image.repository
              tag: controllers.webhook.containers.main.image.tag

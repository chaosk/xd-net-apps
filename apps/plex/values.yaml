fullnameOverride: plex

# Pin PMS image (chart 1.5.0 defaults to 1.43.0.10492-121068a07).
image:
  tag: "1.43.2.10687-563d026ea"

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - plex.net.ecksd.ee
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/weight: "0"
    gethomepage.dev/name: Plex
    gethomepage.dev/description: Media server
    gethomepage.dev/icon: si-plex
    gethomepage.dev/pod-selector: app.kubernetes.io/name=plex-media-server
    # Tracearr widget on the Plex tile (stream stats); Plex widget is on the Tracearr tile.
    gethomepage.dev/widget.type: tracearr
    gethomepage.dev/widget.url: "http://tracearr.tracearr.svc.cluster.local:3000"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_TRACEARR_API_KEY}}"
    gethomepage.dev/widget.view: "details"
    gethomepage.dev/widget.enableUser: "true"
    gethomepage.dev/widget.expandOneStreamToTwoRows: "true"
    gethomepage.dev/widget.showEpisodeNumber: "true"

service:
  type: ClusterIP
  port: 32400

nodeSelector:
  "intel.feature.node.kubernetes.io/gpu": "true"

pms:
  configExistingClaim: plex-config
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
      gpu.intel.com/i915: 1
    limits:
      memory: 4Gi
      cpu: "4"
      gpu.intel.com/i915: 1

extraEnv:
  TZ: UTC
  # VA-API uses the GPU passed through by the Intel GPU device plugin (gpu.intel.com/i915).
  # In Plex: Settings → Transcoder → enable hardware acceleration.

extraVolumeMounts:
  - name: media
    # Library root inside the container (many examples use /data; this app uses /media).
    mountPath: /media

# Tube Archivist Plex integration — https://github.com/tubearchivist/tubearchivist-plex
extraInitContainers:
  - name: tubearchivist-plex
    image: alpine:3.22
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "/install/install.sh"]
    env:
      - name: TA_URL
        valueFrom:
          secretKeyRef:
            name: plex-tubearchivist-plex
            key: TA_URL
            optional: true
      - name: TA_API_KEY
        valueFrom:
          secretKeyRef:
            name: plex-tubearchivist-plex
            key: TA_API_KEY
    volumeMounts:
      - name: pms-config
        mountPath: /config
      - name: tubearchivist-plex-install
        mountPath: /install
        readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

extraVolumes:
  - name: media
    persistentVolumeClaim:
      claimName: plex-media
  - name: tubearchivist-plex-install
    configMap:
      name: plex-tubearchivist-plex-install
      defaultMode: 0755

# PMS logs to files under /config, not stdout. Alloy (monitoring) ships container logs to Loki.
extraContainers:
  - name: log-tailer
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        set -eu
        logdir="/config/Library/Application Support/Plex Media Server/Logs"
        until [ -f "$logdir/Plex Media Server.log" ]; do
          echo "log-tailer: waiting for Plex Media Server.log"
          sleep 5
        done
        exec tail -n 500 -F "$logdir/Plex Media Server.log"
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    volumeMounts:
      - name: pms-config
        mountPath: /config
        readOnly: true

# bjw-s app-template — https://bjw-s-labs.github.io/helm-charts/docs/app-template/
controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/sonarr
          tag: "4.0.19.2997"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 8989
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 8989
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
service:
  main:
    controller: main
    ports:
      http:
        port: 8989
persistence:
  config:
    enabled: true
    existingClaim: sonarr-config
    globalMounts:
    - path: /config
  media:
    enabled: true
    existingClaim: sonarr-media
    globalMounts:
    - path: /data/media
  torrents:
    enabled: true
    existingClaim: sonarr-torrents
    globalMounts:
    - path: /data/torrents
defaultPodOptions:
  securityContext:
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Sonarr
    gethomepage.dev/description: TV library automation
    gethomepage.dev/icon: si-sonarr
    gethomepage.dev/href: "https://sonarr.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=sonarr
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: "http://sonarr.sonarr.svc.cluster.local:8989"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - sonarr.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sonarr
          port: 8989

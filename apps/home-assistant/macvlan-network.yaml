# Secondary IoT interface for Home Assistant (HomeKit, mDNS, local integrations).
# Requires Multus in xd-net (apps/multus.tf) and Cilium cni.exclusive=false.
#
# Workers get a second Proxmox NIC on VLAN 2 (192.168.2.0/24) — see xd-net infra
# worker_iot_vlan_id and patches/worker-iot-nic.yaml. macvlan parent is ens19
# (second worker NIC on VLAN 2 / 192.168.2.0/24).
#
# ipam.routes + sbr: traffic to 192.168.6.0/24 (isolated IoT) uses policy routing table 100
# (from 192.168.2.x src via 192.168.2.1 on net1). Requires sbr in xd-net multus install.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-macvlan
  namespace: home-assistant
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan-macvlan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens19",
          "mode": "bridge",
          "ipam": {
            "type": "host-local",
            "subnet": "192.168.2.0/24",
            "rangeStart": "192.168.2.210",
            "rangeEnd": "192.168.2.219",
            "gateway": "192.168.2.1",
            "routes": [
              {
                "dst": "192.168.6.0/24",
                "gw": "192.168.2.1"
              }
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }

# Installs hass-oidc-auth and merges Authentik OIDC config on the HA config PVC.
# https://github.com/christiaangoossens/hass-oidc-auth
# https://integrations.goauthentik.io/miscellaneous/home-assistant/
#
# HTTP reverse-proxy settings (use_x_forwarded_for / trusted_proxies) are UI-managed
# since HA 2026.8 — do not put an http: block in configuration.yaml.
# https://www.home-assistant.io/integrations/http/#migrating-from-yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-authentik-oidc-install
  namespace: home-assistant
data:
  install.sh: |
    #!/bin/sh
    set -eu

    CONFIG="/config"
    OIDC_VERSION="v1.1.0"
    COMPONENT_DIR="$CONFIG/custom_components/auth_oidc"
    STAMP="$CONFIG/.hass-oidc-auth-version"
    MARKER="xd-net-authentik"
    DISCOVERY_URL="${OIDC_DISCOVERY_URL:-https://authentik.net.ecksd.ee/application/o/home-assistant/.well-known/openid-configuration}"

    apk add --no-cache curl unzip >/dev/null

    install_component() {
      if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$OIDC_VERSION" ] && [ -f "$COMPONENT_DIR/manifest.json" ]; then
        return 0
      fi
      tmpdir=$(mktemp -d)
      trap 'rm -rf "$tmpdir"' EXIT
      curl -fsSL "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/${OIDC_VERSION}/hass-oidc-auth.zip" -o "$tmpdir/oidc.zip"
      rm -rf "$COMPONENT_DIR"
      mkdir -p "$CONFIG/custom_components"
      unzip -q "$tmpdir/oidc.zip" -d "$COMPONENT_DIR"
      echo "$OIDC_VERSION" > "$STAMP"
      echo "hass-oidc-auth ${OIDC_VERSION} installed"
    }

    # Drop deprecated http: YAML (migrated to Settings → System → Network) and legacy files.
    strip_http_yaml() {
      if [ -f "$CONFIG/configuration.yaml" ]; then
        if grep -qE '^(http: !include oidc/http\.yaml|# xd-net-reverse-proxy)$' "$CONFIG/configuration.yaml"; then
          awk '
            /^# xd-net-reverse-proxy$/ { next }
            /^http: !include oidc\/http\.yaml$/ { next }
            { print }
          ' "$CONFIG/configuration.yaml" > "$CONFIG/configuration.yaml.tmp" \
            && mv "$CONFIG/configuration.yaml.tmp" "$CONFIG/configuration.yaml"
          echo "Removed deprecated http: include from configuration.yaml"
        fi
      fi
      rm -f "$CONFIG/oidc/http.yaml"
    }

    configure_ha() {
      if [ ! -f "$CONFIG/configuration.yaml" ]; then
        echo "configuration.yaml not found; restart the pod after Home Assistant creates it"
        return 0
      fi

      strip_http_yaml

      if [ -f /run/secrets/oidc/OIDC_CLIENT_ID ]; then
        OIDC_CLIENT_ID=$(cat /run/secrets/oidc/OIDC_CLIENT_ID)
      fi
      if [ -f /run/secrets/oidc/OIDC_CLIENT_SECRET ]; then
        OIDC_CLIENT_SECRET=$(cat /run/secrets/oidc/OIDC_CLIENT_SECRET)
      fi
      if [ -z "${OIDC_CLIENT_ID:-}" ] || [ -z "${OIDC_CLIENT_SECRET:-}" ] || \
         echo "$OIDC_CLIENT_ID" | grep -q '^REPLACE'; then
        echo "OIDC credentials not set; skipped auth_oidc config"
        return 0
      fi

      mkdir -p "$CONFIG/oidc"
      printf '%s\n' \
        "client_id: \"${OIDC_CLIENT_ID}\"" \
        'client_secret: !secret authentik_client_secret' \
        "discovery_url: \"${DISCOVERY_URL}\"" \
        'display_name: "Authentik"' \
        'features:' \
        '  default_redirect: true' \
        '  force_https: true' \
        > "$CONFIG/oidc/auth_oidc.yaml"
      printf '%s\n' \
        'auth_providers: []' \
        > "$CONFIG/oidc/homeassistant.yaml"
      printf '%s\n' \
        "authentik_client_secret: \"${OIDC_CLIENT_SECRET}\"" \
        > "$CONFIG/secrets.yaml"

      if ! grep -q "$MARKER" "$CONFIG/configuration.yaml"; then
        printf '\n# %s\nhomeassistant: !include oidc/homeassistant.yaml\nauth_oidc: !include oidc/auth_oidc.yaml\n' "$MARKER" >> "$CONFIG/configuration.yaml"
        echo "Appended Authentik OIDC includes to configuration.yaml"
      else
        if ! grep -q 'oidc/homeassistant.yaml' "$CONFIG/configuration.yaml"; then
          printf '\nhomeassistant: !include oidc/homeassistant.yaml\n' >> "$CONFIG/configuration.yaml"
          echo "Appended homeassistant auth_providers include to configuration.yaml"
        fi
        if ! grep -q 'oidc/auth_oidc.yaml' "$CONFIG/configuration.yaml"; then
          printf '\nauth_oidc: !include oidc/auth_oidc.yaml\n' >> "$CONFIG/configuration.yaml"
          echo "Appended auth_oidc include to configuration.yaml"
        fi
      fi
      echo "Wrote oidc/homeassistant.yaml, oidc/auth_oidc.yaml, and secrets.yaml"
    }

    install_component
    configure_ha

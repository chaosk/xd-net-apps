controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: "5.2.3"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "4"
            memory: 2Gi
service:
  main:
    controller: main
    ports:
      http:
        port: 8080
persistence:
  config:
    enabled: true
    existingClaim: qbittorrent-config
    globalMounts:
    - path: /config
  torrents:
    enabled: true
    existingClaim: qbittorrent-torrents
    globalMounts:
    - path: /data/torrents
defaultPodOptions:
  labels:
    vpn-gateway: "true"
  securityContext:
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

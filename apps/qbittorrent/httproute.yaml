apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/description: BitTorrent client
    gethomepage.dev/icon: si-qbittorrent
    gethomepage.dev/href: "https://qbittorrent.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=qbittorrent
spec:
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - qbittorrent.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: qbittorrent
          port: 8080

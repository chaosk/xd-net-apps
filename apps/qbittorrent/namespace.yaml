apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    name: qbittorrent
    allows-vpn-gateway: "true"
    # Stay privileged: pod-gateway injects NET_ADMIN/NET_RAW (baseline forbids them).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

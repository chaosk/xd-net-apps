apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: forward-auth
  namespace: authentik
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: sonarr
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: radarr
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: bazarr
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: prowlarr
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: tubearchivist
  to:
    - group: ""
      kind: Service
      name: authentik-server

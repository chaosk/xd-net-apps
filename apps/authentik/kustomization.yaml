apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - postgres.yaml
  - pvc-authentik-data.yaml
  - referencegrant-forward-auth.yaml
  - httproute-pangolin.yaml

helmCharts:
  - name: authentik
    repo: oci://ghcr.io/goauthentik/helm-charts
    version: ^2026.5
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml

# Official chart: https://github.com/goauthentik/helm
# Docs: https://docs.goauthentik.io/docs/installation/kubernetes/

fullnameOverride: authentik
authentik:
  postgresql:
    host: authentik-db-rw
    name: authentik
    user: authentik
global:
  image:
    # CalVer; Image Updater bumps to the newest stable YYYY.M.P on GHCR (2026.x, 2027.x, …).
    tag: "2026.5.2"
    repository: ghcr.io/goauthentik/server
  # RWO authentik-data: server and worker must share a node. Disable chart anti-affinity
  # (soft spread across hosts); worker.required podAffinity to server is set below.
  affinity:
    podAntiAffinity: none
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    # No pod-level runAsNonRoot: initContainers use UID 0 for chown; main containers
    # use server/worker containerSecurityContext.runAsNonRoot below.
    fsGroup: 1000
    supplementalGroups: [1000]
    fsGroupChangePolicy: Always
  volumes:
  - name: authentik-data
    persistentVolumeClaim:
      claimName: authentik-data
  volumeMounts:
  - name: authentik-data
    mountPath: /data
  env:
  # Must match external URL (TLS hostname on the Gateway). Edit with httproute hostnames.
  - name: AUTHENTIK_HOST
    value: "https://authentik.net.ecksd.ee"
  - name: AUTHENTIK_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: authentik-secret-key
        key: secret_key
  # Same Secret as CNPG bootstrap (`postgres.yaml`); do not put the password in `authentik.postgresql`.
  - name: AUTHENTIK_POSTGRESQL__PASSWORD
    valueFrom:
      secretKeyRef:
        name: authentik-db
        key: password
postgresql:
  enabled: false
# GeoIP (MaxMind GeoLite2 updates on server + worker). See:
# https://docs.goauthentik.io/sys-mgmt/ops/geoip/
geoip:
  enabled: true
  editionIds: "GeoLite2-City GeoLite2-ASN"
  updateInterval: 8
  existingSecret:
    secretName: authentik-geoip
    accountId: account_id
    licenseKey: license_key
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
worker:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # Schedule on the same node as server (required for ReadWriteOnce authentik-data).
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
        topologyKey: kubernetes.io/hostname
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
server:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  initContainers:
  - name: authentik-data-chown
    image: docker.io/library/busybox:1.36
    command:
    - sh
    - -ec
    - |
      chown -R 1000:1000 /data
      chmod -R u+rwX,g+rwX /data
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: authentik-data
      mountPath: /data
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Management
        gethomepage.dev/weight: "30"
        gethomepage.dev/name: Authentik
        gethomepage.dev/description: SSO & identity provider
        gethomepage.dev/icon: si-authentik
        gethomepage.dev/href: "https://authentik.net.ecksd.ee"
        gethomepage.dev/widget.type: authentik
        gethomepage.dev/widget.url: "http://authentik-server.authentik.svc.cluster.local"
        gethomepage.dev/widget.version: "2"
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
        gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik,app.kubernetes.io/component=server
      parentRefs:
      - name: shared
        namespace: gateway
        sectionName: https
      hostnames:
      - authentik.net.ecksd.ee
      additionalRules:
      - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
        backendRefs:
        - name: authentik-server
          port: 80

# Pangolin only (pangolin-operator/site-ref → NewtSite xd-net). One hostname → one public resource.
# Homelab ingress: Helm server.route.main in values.yaml (authentik.net.ecksd.ee on gateway shared).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-pangolin
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    pangolin-operator/site-ref: xd-net
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80

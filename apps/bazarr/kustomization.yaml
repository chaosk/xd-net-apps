apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bazarr

resources:
  - namespace.yaml
  - pvc-config.yaml
  - nfs-media.yaml
  - httproute.yaml
  - securitypolicy-forward-auth.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: bazarr
    namespace: bazarr
    valuesFile: values.yaml

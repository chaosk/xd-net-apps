# Same NFS export as Plex (`apps/plex/nfs-media.yaml`); separate PV per namespace.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-media-pv
spec:
  capacity:
    storage: 16Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: nas.net.ecksd.ee
    path: /volume1/malachit/media/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-media
  namespace: bazarr
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 16Ti
  volumeName: bazarr-media-pv
  storageClassName: ""

controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/bazarr
          tag: "1.5.6"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6767
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6767
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 6767

persistence:
  config:
    enabled: true
    existingClaim: bazarr-config
    globalMounts:
      - path: /config
  media:
    enabled: true
    existingClaim: bazarr-media
    globalMounts:
      - path: /data/media

defaultPodOptions:
  securityContext:
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch

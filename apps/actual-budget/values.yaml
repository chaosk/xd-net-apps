# bjw-s app-template — https://bjw-s-labs.github.io/helm-charts/docs/app-template/
# Actual Budget — https://actualbudget.org/docs/install/docker
controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/actualbudget/actual-server
          tag: "26.7.0"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
          ACTUAL_PORT: "5006"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 5006
              initialDelaySeconds: 30
              periodSeconds: 60
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 5006
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 5006
persistence:
  data:
    enabled: true
    existingClaim: actual-budget-data
    globalMounts:
    - path: /data

# Overrides for official Tracearr Helm chart (vendored under vendor/).
# Upstream defaults: https://github.com/connorgallopo/Tracearr/blob/main/docker/helm/tracearr/values.yaml
# Install guide: https://docs.tracearr.com/getting-started/installation/kubernetes
# PostgreSQL: CloudNativePG cluster tracearr-db (postgres.yaml), not chart Timescale StatefulSet.

fullnameOverride: tracearr
secrets:
  autoGenerate: false
  existingSecret: tracearr-db
timescale:
  enabled: false
externalDatabase:
  host: tracearr-db-rw
  port: 5432
  user: tracearr
  database: tracearr
redis:
  persistence:
    storageClass: synology
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
tracearr:
  image:
    tag: "2.2.0" # ghcr.io/connorgallopo/tracearr (pin; Image Updater tracks ~2)
    repository: ghcr.io/connorgallopo/tracearr
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  backups:
    storageClass: synology
  imageCache:
    storageClass: synology
ingress:
  enabled: false

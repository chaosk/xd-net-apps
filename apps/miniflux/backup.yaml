apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://cnpg-barman/
    endpointURL: https://s3.nas.net.ecksd.ee
    s3Credentials:
      accessKeyId:
        name: cnpg-barman-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-barman-s3
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-barman-s3
        key: REGION
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: miniflux-db-daily
spec:
  schedule: "0 20 4 * * *"
  backupOwnerReference: self
  immediate: false
  cluster:
    name: miniflux-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux
  namespace: miniflux
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Misc
    gethomepage.dev/weight: "30"
    gethomepage.dev/name: Miniflux
    gethomepage.dev/description: Minimalist RSS reader
    gethomepage.dev/icon: si-miniflux
    gethomepage.dev/href: "https://miniflux.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=miniflux
    gethomepage.dev/widget.type: miniflux
    gethomepage.dev/widget.url: "http://miniflux.miniflux.svc.cluster.local:8080"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_MINIFLUX_API_KEY}}"
    gethomepage.dev/widget.fields: '["unread"]'
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - miniflux.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: miniflux
          port: 8080

# https://github.com/unpoller/helm-chart
# https://unpoller.com/docs/install/configuration/

replicaCount: 1
image:
  repository: ghcr.io/unpoller/unpoller
  tag: v3.4.1
dashboards:
  create: false
  grafana:
    create: false
# UniFi controller URL, user, and password come from Secret unpoller-unifi via deployment-patch.yaml (UP_UNIFI_DEFAULT_*).
upConfig: |
  [poller]
  debug = false
  quiet = false
  [prometheus]
  disable = false
  http_listen = "0.0.0.0:9130"
  report_errors = false
  [influxdb]
  disable = true
  [unifi]
  dynamic = false
  [loki]
  disable = true
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
# The chart probes :9130 immediately with no startup grace. UniPoller connects to the
# controller first and only binds the Prometheus listener after the initial poll; with DPI
# enabled that routinely exceeds 30s, so kubelet kills the container before / answers.
livenessProbe:
  httpGet:
    path: /
    port: tcp
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: tcp
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

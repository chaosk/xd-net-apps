# PeaNUT Prometheus metrics — enable in PeaNUT UI (Settings) after deploy; allow cluster scrape (e.g. 10.0.0.0/8).
# https://github.com/Brandawg93/PeaNUT — GET /api/v1/metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: peanut
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - peanut
  selector:
    matchLabels:
      app.kubernetes.io/service: peanut
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s

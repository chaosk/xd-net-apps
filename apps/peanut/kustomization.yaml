apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: peanut

resources:
  - namespace.yaml
  - pvc.yaml
  - httproute.yaml
  - servicemonitor.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: peanut
    namespace: peanut
    valuesFile: values.yaml

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: peanut
  namespace: peanut
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Management
    gethomepage.dev/weight: "15"
    gethomepage.dev/name: PeaNUT
    gethomepage.dev/description: UPS (NUT via Synology)
    gethomepage.dev/icon: mdi-power-plug-battery-outline
    gethomepage.dev/href: "https://peanut.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=peanut
    gethomepage.dev/widget.type: peanut
    gethomepage.dev/widget.url: "http://peanut.peanut.svc.cluster.local:8080"
    gethomepage.dev/widget.key: "ups"
    gethomepage.dev/widget.fields: '["battery_charge", "ups_load", "ups_status"]'
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - peanut.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: peanut
          port: 8080

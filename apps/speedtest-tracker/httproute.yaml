apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Misc
    gethomepage.dev/weight: "20"
    gethomepage.dev/name: Speedtest
    gethomepage.dev/description: ISP bandwidth history
    gethomepage.dev/icon: si-speedtest
    gethomepage.dev/href: "https://speedtest.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=speedtest-tracker
    gethomepage.dev/widget.type: speedtest
    gethomepage.dev/widget.url: "http://speedtest-tracker.speedtest-tracker.svc.cluster.local:80"
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SPEEDTEST_TRACKER_API_KEY}}"
    gethomepage.dev/widget.fields: '["download", "upload", "ping"]'
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - speedtest.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: speedtest-tracker
          port: 80

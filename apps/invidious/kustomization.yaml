apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: invidious

resources:
  - namespace.yaml
  - postgres.yaml
  - backup.yaml
  - service-companion.yaml
  - httproute.yaml
  - securitypolicy-forward-auth.yaml
  - restart-cronjob.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: invidious
    namespace: invidious
    valuesFile: values.yaml

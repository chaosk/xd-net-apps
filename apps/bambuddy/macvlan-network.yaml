# IoT LAN for Bambu printer control (MQTT/FTP/camera). Same layout as home-assistant,
# on a separate IP slice from HA (.210–.219). The host-local pool is pinned to a single
# address (rangeStart == rangeEnd == 192.168.2.220) so BamBuddy always binds the same IP —
# Bambu Studio pins printers by IP, so a changing address would force re-adding the printer
# on every restart/reschedule.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-macvlan
  namespace: bambuddy
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan-macvlan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens19",
          "mode": "bridge",
          "ipam": {
            "type": "host-local",
            "subnet": "192.168.2.0/24",
            "rangeStart": "192.168.2.220",
            "rangeEnd": "192.168.2.220",
            "gateway": "192.168.2.1",
            "routes": [
              {
                "dst": "192.168.6.0/24",
                "gw": "192.168.2.1"
              }
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }

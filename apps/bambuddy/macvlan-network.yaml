# IoT LAN for Bambu printer control (MQTT/FTP/camera). Same layout as home-assistant;
# uses a separate IP slice (.230–.234) so pods do not collide with HA (.210–.219).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-macvlan
  namespace: bambuddy
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan-macvlan",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens19",
          "mode": "bridge",
          "ipam": {
            "type": "host-local",
            "subnet": "192.168.2.0/24",
            "rangeStart": "192.168.2.230",
            "rangeEnd": "192.168.2.234",
            "gateway": "192.168.2.1",
            "routes": [
              {
                "dst": "192.168.6.0/24",
                "gw": "192.168.2.1"
              }
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }

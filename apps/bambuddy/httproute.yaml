apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bambuddy
  namespace: bambuddy
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Misc
    gethomepage.dev/weight: "35"
    gethomepage.dev/name: Bambuddy
    gethomepage.dev/description: Bambu Lab print farm command center
    gethomepage.dev/icon: mdi-printer-3d
    gethomepage.dev/href: "https://bambuddy.net.ecksd.ee"
    # Scope to the main controller: the bambu-studio controller shares app.kubernetes.io/name=bambuddy.
    gethomepage.dev/pod-selector: app.kubernetes.io/name=bambuddy,app.kubernetes.io/controller=main
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - bambuddy.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bambuddy
          port: 8000

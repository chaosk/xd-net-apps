apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealie

resources:
  - namespace.yaml
  - postgres.yaml
  - backup.yaml
  - pvc.yaml
  - httproute.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: mealie
    namespace: mealie
    valuesFile: values.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prowlarr

resources:
  - namespace.yaml
  - pvc-config.yaml
  - httproute.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: prowlarr
    namespace: prowlarr
    valuesFile: values.yaml

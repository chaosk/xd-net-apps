# Pangolin only (pangolin-operator/site-ref → NewtSite xd-net). One hostname → one public resource.
# Discord OAuth and the calendar feeds need this host on the public internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: marian-pangolin
  namespace: marian
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    pangolin-operator/site-ref: xd-net
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - marian.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: marian
          port: 8080

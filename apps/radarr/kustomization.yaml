apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radarr

resources:
  - namespace.yaml
  - pvc-config.yaml
  - nfs-media.yaml
  - httproute.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts/
    version: 5.0.1
    releaseName: radarr
    namespace: radarr
    valuesFile: values.yaml

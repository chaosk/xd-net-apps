# Ingest torrents export; separate PV per namespace.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-torrents-pv
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: nas.net.ecksd.ee
    path: /volume1/ingest/torrents
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-torrents
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
  volumeName: radarr-torrents-pv
  storageClassName: ""

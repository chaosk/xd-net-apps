apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Radarr
    gethomepage.dev/description: Movie library automation
    gethomepage.dev/icon: si-radarr
    gethomepage.dev/href: "https://radarr.net.ecksd.ee"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=radarr
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: "http://radarr.radarr.svc.cluster.local:7878"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - radarr.net.ecksd.ee
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radarr
          port: 7878
